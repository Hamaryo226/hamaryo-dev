name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        # 配信物に載らない開発ツールの勧告では止めない。eslint 系が引く minimatch の
        # GHSA-g3hv-75wg-m249 は、minimatch 11 が makeRe の名前付きエクスポートを
        # 落としたため eslint-plugin-import-x が動かず、上げて塞ぐことができない
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:security
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
